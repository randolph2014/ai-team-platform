[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-team-platform"
version = "0.1.0"
description = "Workflow engine, CLI, API, and dashboard for AI Team pipelines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.29",
  "fastapi>=0.110",
  "pydantic>=2.6",
  "PyJWT>=2.8",
  "pyyaml>=6.0",
  "redis>=5.0",
  "rq>=1.16",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "httpx>=0.27",
]
logging = [
  "structlog>=24",
]
metrics = [
  "prometheus-client>=0.20",
]
all = [
  "structlog>=24",
  "prometheus-client>=0.20",
]

[project.scripts]
ai-team = "cli.main:main"

[tool.setuptools]
packages = ["engine", "cli", "api", "api.routes", "persistence"]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = [
  "-v",
  "--tb=short",
  "--strict-markers",
  "-p no:cacheprovider",
]

[tool.coverage.run]
source = ["engine", "persistence", "api"]
branch = true
omit = ["tests/*"]
