[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-team-platform"
version = "0.1.0"
description = "Workflow engine, CLI, API, and dashboard for AI Team pipelines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.29",
  "fastapi>=0.110",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
ai-team = "cli.main:main"

[tool.setuptools]
packages = ["engine", "cli", "api", "api.routes", "persistence"]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
