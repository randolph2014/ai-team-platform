#       required: true
#     - name: pytest
#       type: command
#       command: "python3 -m pytest --tb=short -q 2>&1"
#       required: true
#       max_retries: 1
# 示例（Node 项目）：
#   quality_gates:
#     - name: typescript-check
#       type: command
#       command: "npx tsc --noEmit 2>&1"
#       required: true
#     - name: test
#       type: command
#       command: "npm test 2>&1"
#       required: true
#       max_retries: 1
quality_gates: []
