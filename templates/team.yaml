# ============================================================
# AI Team 平台默认配置
# ============================================================
# 项目级配置放在 .ai/team.yaml，会优先于此文件加载。
#
# ── runtimes ──────────────────────────────────────────────
# 声明可用的 CLI 工具池。每个 runtime 是一个独立的 CLI 适配配置，
# agent 通过 runtime_id 引用。同一 CLI 可定义多个 runtime（不同
# 模型 / 不同参数）。
#
# 平台内置 3 种 CLI 适配（claude / codex / opencode），
# 这些 CLI 的 args / prompt_mode / model_arg_style 默认值已在
# engine/runtimes.py 的 RUNTIME_SPECS 中预设，配置时可省略。
#
# 接入未内置的 CLI（如 gemini-cli、cursor-cli）时，在 yaml 中显式声明
# cli / args / prompt_mode / model_arg_style 等字段即可，无需修改
# Python 代码。具体示例见下方 `gemini:` 注释块。
#
# 模型配置：
#   - model：指定模型名（也可由 AI_TEAM_<CLI>_MODEL 环境变量覆盖）
#   - 留空时自动从 CLI 配置文件读取当前使用的模型
#
# ── agents ────────────────────────────────────────────────
# 每个 agent 通过 runtime_id 绑定一个 runtime。pipeline 通过 agent
# 名字引用 agent，因此可以方便地给不同 agent 配置不同模型 / 不同 CLI。
# ============================================================

runtimes:
  # 默认入口：按 claude → codex → opencode 顺序自动探测系统中已装的 CLI
  auto:
    name: Auto
    cli: auto

  # ── 以下是进阶示例（默认注释）。按需启用或复制到项目级配置 ──

  # 示例 1：Claude Opus —— 深度推理，适合架构 / 方案定稿
  # claude-opus:
  #   name: Claude Opus
  #   cli: claude
  #   model: claude-opus-4-7

  # 示例 2：Claude Sonnet —— 日常编码，性价比平衡
  # claude-sonnet:
  #   name: Claude Sonnet
  #   cli: claude
  #   model: claude-sonnet-4-5

  # 示例 3：Codex CLI —— args / model_arg_style 由内置 SPEC 提供
  # codex:
  #   name: Codex CLI
  #   cli: codex

  # 示例 4：未内置的新 CLI（gemini-cli），所有字段需显式声明
  # gemini:
  #   name: Gemini CLI
  #   cli: gemini
  #   args: [--no-stream]
  #   prompt_mode: stdin              # arg | stdin
  #   model_arg_style: long           # long(--model) | codex(-m)
  #   model: gemini-2.5-pro

agents:
  - name: requirements-analyst
    runtime_id: auto
    role: analyst
    prompt: agents/requirements-analyst.md

  # solution-architect 只用于超大需求的结构化拆分，不参与默认方案定稿。
  - name: solution-architect
    runtime_id: auto
    role: architect
    prompt: agents/solution-architect.md

  - name: devils-advocate
    runtime_id: auto
    role: reviewer
    prompt: agents/devils-advocate.md

  - name: planner
    runtime_id: auto
    role: planner
    prompt: agents/planner.md

  # tech-lead / qa / reviewer 用 sonnet 系性价比更高；启用 claude-sonnet
  # 后可改为 runtime_id: claude-sonnet
  - name: tech-lead
    runtime_id: auto
    role: lead
    prompt: agents/tech-lead.md

  - name: qa-automation
    runtime_id: auto
    role: tester
    prompt: agents/qa-automation.md

  - name: code-reviewer
    runtime_id: auto
    role: reviewer
    prompt: agents/code-reviewer.md

  - name: retrospect
    runtime_id: auto
    role: summarizer
    prompt: agents/retrospect.md

worktree:
  enabled: true
  base_branch: main
  merge_strategy: squash
  auto_cleanup: true
  merge_on_conflict: pause

runner:
  auto_split_requirements: true
  context_threshold_chars: 100000

pipeline:
  execution_mode: parallel
  stages:
    - id: context_scan
      name: "代码库扫描"
      type: context_scan
      output_file: codebase-context.md
      output_json: codebase-context.json
      required_artifacts:
        - codebase-context.md
        - codebase-context.json

    - id: requirement_analysis
      name: "需求分析"
      parallel: true
      agents: [requirements-analyst, devils-advocate]
      input: [requirement, codebase-context.md, codebase-context.json]
      output:
        requirements-analyst: requirement-analysis.md
        devils-advocate: requirement-gap-analysis.md
      required_artifacts:
        - requirement-analysis.md
        - requirement-gap-analysis.md

    - id: requirement_synthesis
      name: "需求综合定稿"
      parallel: false
      agents: [requirements-analyst]
      input:
        - requirement
        - codebase-context.md
        - codebase-context.json
        - requirement-analysis.md
        - requirement-gap-analysis.md
        - human-decision-requirement*.json
      output:
        requirements-analyst: requirement-final.md
      json_artifacts:
        - requirement-final.json
      required_artifacts:
        - requirement-final.md
        - requirement-final.json

    - id: requirement_confirm
      name: "需求人工确认"
      type: human_review
      input: [requirement-final.md]
      output_file: human-decision-requirement.md
      decision_file: human-decision-requirement.json
      allow_auto_approve: false
      requires_reason_on_reject: true
      reject_to: requirement_synthesis

    - id: planning
      name: "方案与任务规划"
      parallel: false
      agents: [planner]
      input:
        - requirement-final.md
        - requirement-final.json
        - codebase-context.md
        - codebase-context.json
        - human-decision-requirement.json
        - human-decision-task-plan*.json
      output:
        planner: task-plan.md
      json_artifacts:
        - solution-plan.json
        - task-plan.json
      required_artifacts:
        - task-plan.md
        - solution-plan.json
        - task-plan.json

    - id: task_plan_confirm
      name: "任务规划人工确认"
      type: human_review
      input: [task-plan.md]
      output_file: human-decision-task-plan.md
      decision_file: human-decision-task-plan.json
      allow_auto_approve: false
      requires_reason_on_reject: true
      reject_to: planning

    - id: develop
      name: "开发实施"
      parallel: false
      agents: [tech-lead]
      input:
        - requirement-final.md
        - requirement-final.json
        - codebase-context.md
        - codebase-context.json
        - solution-plan.json
        - task-plan.md
        - task-plan.json
        - human-decision-task-plan.json
        - human-decision-acceptance*.json
      output:
        tech-lead: implementation-report.md
      json_artifacts:
        - implementation-report.json
      required_artifacts:
        - implementation-report.md
        - implementation-report.json

    - id: qa
      name: "自动测试"
      parallel: false
      agents: [qa-automation]
      input:
        - requirement-final.md
        - requirement-final.json
        - solution-plan.json
        - task-plan.md
        - task-plan.json
        - implementation-report.md
        - implementation-report.json
        - git-diff
      output:
        qa-automation: test-report.md
      json_artifacts:
        - test-report.json
      required_artifacts:
        - test-report.md
        - test-report.json
      loopback_to: develop
      loopback_trigger: ["FAILED", "ERROR", "失败", "exit code: 1", "退出码: 1"]
      max_retries: 2

    - id: review
      name: "代码审查与风险识别"
      parallel: false
      agents: [code-reviewer]
      input:
        - requirement-final.md
        - requirement-final.json
        - solution-plan.json
        - task-plan.md
        - task-plan.json
        - implementation-report.md
        - implementation-report.json
        - test-report.md
        - test-report.json
        - git-diff
      output:
        code-reviewer: review-report.md
      json_artifacts:
        - review-report.json
      required_artifacts:
        - review-report.md
        - review-report.json
      loopback_to: develop
      loopback_trigger: "Request Changes"
      max_retries: 2

    - id: acceptance_confirm
      name: "最终人工验收"
      type: human_review
      input:
        - requirement-final.md
        - requirement-final.json
        - solution-plan.json
        - task-plan.md
        - task-plan.json
        - implementation-report.md
        - implementation-report.json
        - test-report.md
        - test-report.json
        - review-report.md
        - review-report.json
        - git-diff
      output_file: human-decision-acceptance.md
      decision_file: human-decision-acceptance.json
      allow_auto_approve: false
      requires_reason_on_reject: true
      reject_to: develop

    - id: retrospect
      name: "结果复盘"
      parallel: false
      agents: [retrospect]
      input:
        - requirement-final.md
        - requirement-final.json
        - solution-plan.json
        - task-plan.md
        - task-plan.json
        - implementation-report.md
        - implementation-report.json
        - test-report.md
        - test-report.json
        - review-report.md
        - review-report.json
        - human-decision-acceptance.json
        - git-diff
      output:
        retrospect: retrospect-report.md
      json_artifacts:
        - retrospect-report.json
      required_artifacts:
        - retrospect-report.md
        - retrospect-report.json

# Quality Gates — develop 阶段完成后自动运行。
# 项目级 .ai/team.yaml 可覆盖此配置。
# 示例（Python 项目）：
#   quality_gates:
#     - name: python-syntax
#       type: command
