# ============================================================
# AI Team 平台默认配置
# ============================================================
# 项目级配置放在 .ai/team.yaml，会优先于此文件加载。
#
# ── runtimes ──────────────────────────────────────────────
# 声明可用的 CLI 工具池。每个 runtime 是一个独立的 CLI 适配配置，
# agent 通过 runtime_id 引用。同一 CLI 可定义多个 runtime（不同
# 模型 / 不同参数）。
#
# 平台内置 5 种 CLI 适配（claude / codex / opencode / hermes / kiro），
# 这些 CLI 的 args / prompt_mode / model_arg_style 默认值已在
# engine/runtimes.py 的 RUNTIME_SPECS 中预设，配置时可省略。
# （hermes / kiro 当前仅检测存在，不支持执行。）
#
# 接入未内置的 CLI（如 gemini-cli、cursor-cli）时，在 yaml 中显式声明
# cli / args / prompt_mode / model_arg_style 等字段即可，无需修改
# Python 代码。具体示例见下方 `gemini:` 注释块。
#
# 模型与降级：
#   - model：默认模型名（也可由 AI_TEAM_<CLI>_MODEL 环境变量覆盖）
#   - fallback_models：主模型失败时按顺序降级
#
# ── agents ────────────────────────────────────────────────
# 每个 agent 通过 runtime_id 绑定一个 runtime。pipeline 通过 agent
# 名字引用 agent，因此可以方便地给不同 agent 配置不同模型 / 不同 CLI。
# ============================================================

runtimes:
  # 默认入口：按 claude → codex → opencode 顺序自动探测系统中已装的 CLI
  auto:
    name: Auto
    cli: auto

  # ── 以下是进阶示例（默认注释）。按需启用或复制到项目级配置 ──

  # 示例 1：Claude Opus —— 深度推理，适合架构 / 方案定稿
  # claude-opus:
  #   name: Claude Opus
  #   cli: claude
  #   model: claude-opus-4-7
  #   fallback_models: [claude-sonnet-4-5]

  # 示例 2：Claude Sonnet —— 日常编码，性价比平衡
  # claude-sonnet:
  #   name: Claude Sonnet
  #   cli: claude
  #   model: claude-sonnet-4-5
  #   fallback_models: [claude-haiku-4-5]

  # 示例 3：Codex CLI —— args / model_arg_style 由内置 SPEC 提供
  # codex:
  #   name: Codex CLI
  #   cli: codex

  # 示例 4：未内置的新 CLI（gemini-cli），所有字段需显式声明
  # gemini:
  #   name: Gemini CLI
  #   cli: gemini
  #   args: [--no-stream]
  #   prompt_mode: stdin              # arg | stdin
  #   model_arg_style: long           # long(--model) | codex(-m)
  #   model: gemini-2.5-pro

agents:
  - name: requirements-analyst
    runtime_id: auto
    role: analyst
    prompt: agents/requirements-analyst.md

  # solution-architect 通常需要更强模型；启用 claude-opus 后可改为
  # runtime_id: claude-opus
  - name: solution-architect
    runtime_id: auto
    role: architect
    prompt: agents/solution-architect.md

  - name: brainstormer
    runtime_id: auto
    role: brainstormer
    prompt: agents/brainstormer.md

  - name: devils-advocate
    runtime_id: auto
    role: reviewer
    prompt: agents/devils-advocate.md

  - name: planner
    runtime_id: auto
    role: planner
    prompt: agents/planner.md

  # tech-lead / qa / reviewer 用 sonnet 系性价比更高；启用 claude-sonnet
  # 后可改为 runtime_id: claude-sonnet
  - name: tech-lead
    runtime_id: auto
    role: lead
    prompt: agents/tech-lead.md

  - name: qa-automation
    runtime_id: auto
    role: tester
    prompt: agents/qa-automation.md

  - name: code-reviewer
    runtime_id: auto
    role: reviewer
    prompt: agents/code-reviewer.md

  - name: risk-analyst
    runtime_id: auto
    role: analyst
    prompt: agents/risk-analyst.md

  - name: doc-writer
    runtime_id: auto
    role: writer
    prompt: agents/doc-writer.md

  - name: retrospect
    runtime_id: auto
    role: summarizer
    prompt: agents/retrospect.md

worktree:
  enabled: true
  base_branch: main
  merge_strategy: squash
  auto_cleanup: true
  merge_on_conflict: pause

runner:
  auto_split_requirements: true
  context_threshold_chars: 100000

pipeline:
  execution_mode: parallel
  stages:
    - id: analyse
      name: "需求分析"
      parallel: false
      agents: [requirements-analyst]
      input: requirement
      output:
        requirements-analyst: requirement-analysis.md

    - id: plan
      name: "方案讨论"
      parallel: true
      agents: [brainstormer, devils-advocate]
      input: [requirement, requirement-analysis.md, requirement-analysis.json]
      output:
        brainstormer: brainstorm.md
        devils-advocate: gap-analysis.md

    - id: plan_confirm
      name: "方案确认"
      type: human_review
      input: [requirement, brainstorm.md, gap-analysis.md]
      skip_if_no_blocker: true
      blocker_source: gap-analysis.md
      output_file: requirement-decisions.md

    - id: architect
      name: "方案定稿"
      parallel: false
      agents: [solution-architect]
      input: [requirement, brainstorm.md, gap-analysis.md, requirement-decisions.md]
      output:
        solution-architect: solution-draft.md

    - id: context
      name: "代码库扫描"
      type: context_scan
      input: [solution-draft.md]
      output_file: codebase-context.md

    - id: task_plan
      name: "任务规划"
      parallel: false
      agents: [planner]
      input: [requirement, solution-draft.md, codebase-context.md, requirement-analysis.json]
      output:
        planner: task-plan.md

    - id: develop
      name: "开发"
      parallel: false
      agents: [tech-lead]
      input: [requirement, solution-draft.md, codebase-context.md, task-plan.md, task-plan.json]
      output:
        tech-lead: tech-lead-output.md
      loopback_to: develop
      loopback_trigger: "error:"
      max_retries: 3

    - id: code_apply
      name: "代码应用"
      type: code_apply
      input: [tech-lead-output.md]

    - id: qa
      name: "测试"
      parallel: false
      stop_parallel_on_first_error: false
      agents: [qa-automation]
      input: [requirement, solution-draft.md, codebase-context.md, tech-lead-output.md, "git-diff"]
      output:
        qa-automation: test-report.md
      loopback_to: develop
      loopback_trigger: ["FAILED", "ERROR", "失败", "exit code: 1", "退出码: 1"]
      max_retries: 2

    - id: review
      name: "代码审查"
      parallel: false
      agents: [code-reviewer]
      input: [requirement, solution-draft.md, codebase-context.md, tech-lead-output.md, test-report.md, "git-diff"]
      output:
        code-reviewer: review-report.md
      loopback_to: develop
      loopback_trigger: "Request Changes"
      max_retries: 2

    - id: risk_analysis
      name: "风险识别"
      parallel: false
      agents: [risk-analyst]
      input: [requirement, solution-draft.md, codebase-context.md, tech-lead-output.md, test-report.md, review-report.md, "git-diff"]
      output:
        risk-analyst: risk-report.md

    - id: doc
      name: "文档整理"
      parallel: false
      agents: [doc-writer]
      input: [requirement, solution-draft.md, codebase-context.md, tech-lead-output.md, test-report.md, review-report.md, risk-report.md, "git-diff"]
      output:
        doc-writer: doc-output.md

    - id: accept
      name: "人工验收"
      type: human_review
      input: [requirement, solution-draft.md, codebase-context.md, tech-lead-output.md, test-report.md, review-report.md, risk-report.md, doc-output.md, "git-diff"]

    - id: retrospect
      name: "结果复盘"
      parallel: false
      agents: [retrospect]
      input: [requirement, solution-draft.md, codebase-context.md, tech-lead-output.md, test-report.md, review-report.md, risk-report.md, doc-output.md, "git-diff"]
      output:
        retrospect: final-summary.md

# Quality Gates — develop 阶段完成后自动运行。
# 项目级 .ai/team.yaml 可覆盖此配置。
# 示例（Python 项目）：
