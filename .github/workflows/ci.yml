# CI 工作流：代码质量检查和自动化测试
# 触发条件：push 到 main、PR 到 main
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ——————————————————————————————————————————————————————————————————————
  # Python 后端测试
  # ——————————————————————————————————————————————————————————————————————
  test-backend:
    name: Python Tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3.12 -m pip install --upgrade pip
          python3.12 -m pip install -e ".[dev]"

      - name: Run tests
        run: python3.12 -m pytest tests/ -v --tb=short

  # ——————————————————————————————————————————————————————————————————————
  # 前端构建测试
  # ——————————————————————————————————————————————————————————————————————
  test-frontend:
    name: Frontend Build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: cd web && npm ci

      - name: Build
        run: cd web && npm run build
