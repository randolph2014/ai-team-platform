# CI 工作流：代码质量检查和自动化测试
# 触发条件：push 到 main、PR 到 main
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ——————————————————————————————————————————————————————————————————————
  # Python 后端测试（矩阵测试 Python 3.11+）
  # ——————————————————————————————————————————————————————————————————————
  test-backend:
    name: Python ${{ matrix.python-version }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ——————————————————————————————————————————————————————————————————————
  # 前端构建测试（Node 18+）
  # ——————————————————————————————————————————————————————————————————————
  test-frontend:
    name: Frontend Build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: |
          if [ -f "web/package.json" ]; then
            cd web && npm ci
          else
            echo "No web/package.json found, skipping"
          fi

      - name: Build
        run: |
          if [ -f "web/package.json" ]; then
            cd web && npm run build
          else
            echo "No web/package.json found, skipping"
          fi
