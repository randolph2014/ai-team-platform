name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
  PIP_TRUSTED_HOST: mirrors.aliyun.com

jobs:
  repo-hygiene:
    name: Repository Hygiene
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Check repository hygiene
        run: bash scripts/check_repo_hygiene.sh

  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: self-hosted
    needs: repo-hygiene
    steps:
      - uses: actions/checkout@v4

      - name: Create venv and install dependencies
        run: |
          python3.12 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          source .venv/bin/activate
          pip install ruff
          ruff check engine/ api/ persistence/ cli/ --quiet

      - name: Typecheck (mypy)
        run: |
          source .venv/bin/activate
          pip install mypy
          mypy engine/release_readiness.py engine/audit.py engine/metrics.py engine/secret_store.py engine/webhook_delivery.py engine/pr_manager.py engine/worktree.py scripts/fail_on_detect_secrets.py --ignore-missing-imports --follow-imports=silent --no-error-summary

  secret-scan:
    name: Secret Scan
    runs-on: self-hosted
    needs: repo-hygiene
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secrets (detect-secrets)
        run: |
          pip install detect-secrets
          detect-secrets scan --all-files --force-use-all-plugins . 2>/dev/null > /tmp/baseline.json
          python scripts/fail_on_detect_secrets.py /tmp/baseline.json

  dependency-audit:
    name: Dependency Audit
    runs-on: self-hosted
    needs: repo-hygiene
    steps:
      - uses: actions/checkout@v4

      - name: Create venv and audit dependencies
        run: |
          python3.12 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit
          pip-audit --desc

  test-backend:
    name: Python Tests
    runs-on: self-hosted
    needs: [lint-and-typecheck, dependency-audit]
    steps:
      - uses: actions/checkout@v4

      - name: Create venv and install dependencies
        run: |
          python3.12 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          source .venv/bin/activate
          pytest tests/ -v --tb=short --cov=engine --cov=api --cov=persistence --cov-report=term-missing --cov-fail-under=50

  test-frontend:
    name: Frontend Build
    runs-on: self-hosted
    needs: repo-hygiene
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: cd web && npm ci

      - name: Typecheck
        run: cd web && npm run typecheck

      - name: Unit tests
        run: cd web && npm test

      - name: Install Playwright browser
        run: cd web && npx playwright install chromium

      - name: Playwright smoke
        run: cd web && npm run smoke:playwright

      - name: Build
        run: cd web && npm run build

  docker-build:
    name: Docker Build Test
    runs-on: self-hosted
    needs: test-backend
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t ai-team-api:ci-test .

      - name: Verify non-root user
        run: |
          docker run --rm ai-team-api:ci-test whoami | grep -q appuser
