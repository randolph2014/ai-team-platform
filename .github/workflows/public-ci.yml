name: Public CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  basic:
    name: GitHub-hosted basic checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check CLI entrypoint
        run: ai-team --help

      - name: Python tests
        run: pytest tests/ -q

      - name: Repository hygiene
        run: bash scripts/check_repo_hygiene.sh

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Frontend tests
        working-directory: web
        run: npm run test

      - name: Frontend build
        working-directory: web
        run: npm run build
